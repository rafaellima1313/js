<body>
  <script>
   function minMax(nums) {
     if (!nums || nums.length === 0) {
      return { min: null, max: null }
    }

    const result = {
      min: nums[0],
      max: nums[0]
    };

    for (let i = 1; i < nums.length; i++) {
      let value = nums[i];

      if (value < result.min) {
        result.min = value;
      }

      if (value > result.max) {
        result.max = value;
      }
    }

    return result;
   }

   console.log(minMax())
  </script>
</body>
</html>
