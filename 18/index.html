<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aprendendo Dom</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>DOM - Document Object Model</h1>

  <div>
    <p>
      Youtube Subscribe Button
    </p>

    <button class="js-sub subscribe-button" onclick="clickButton()">Subscribe</button>
  </div>

  <div>
    <p>
      Amazon Shipping Calculator
    </p>

    <p>
      Orders under $40 = +$10 shipping.
    </p>

    <p>
      Orders over $40 = FREE shipping.
    </p>

    <input name="number" id="js-input" class="input-data" placeholder="Cost of order" onkeydown="handleCostKeydown(event)">

    <button onclick="calculateButton(event)" class="calculate-btn">Calculate</button>

    <p class="js-output"></p>
  </div>

  <div>
    <p>Play <a href="../19-new-rock-papper/">Rock Papper Scissors</a></p>
  </div>


  <script>
    function handleCostKeydown(event) {
      if (event.key === 'Enter') {
        calculateButton();
      }
    }

    function calculateButton(event) {
      const inputValue = Number(document.body.querySelector('#js-input').value);

      const outputElem = document.body.querySelector('.js-output');

      let cents = Math.round(inputValue * 100)

      if (cents < 4000) {
        outputElem.innerHTML = `$${((cents + 1000) / 100).toFixed(2)}`
      } else {
        outputElem.innerHTML = `$${(cents / 100).toFixed(2)}`;
      }

      console.log(event);
    }


    function clickButton() {
      let buttonElem = document.body.querySelector('.js-sub');

      if (buttonElem.innerText === 'Subscribe') {
        buttonElem.innerHTML = 'Subscribed';
        buttonElem.classList.add('is-subscribed');
      } else {
        buttonElem.innerHTML = 'Subscribe';
        buttonElem.classList.remove('is-subscribed');
      }
    }
  </script>
</body>
</html>
