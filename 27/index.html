<body>
  <script>
    function minMax(num) {
      if (!num || num === 0) {
        return { min: undefined, max: undefined };
      }

      const result = {
        min: num[0],
        max: num[0]
      }

      for (let i = 0; i < num.length; i++) {
        const value = num[i];

        if (value < result.min) {
          result.min = value;
        }

        if (value > result.max) {
          result.max = value;
        }
        

      }

      return result;
    }  

    console.log(minMax())
  </script>
</body>
