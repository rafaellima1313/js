<body>
  <script>
    function countPositive(nums) {
      let result = 0;

      for (let i = 0; i < nums.length; i++) {
        if (nums[i] > 0) {
          result++
        }
      }
      return result;
    }

    console.log(countPositive([-1, -2, 2, 3, 3]));
      
  </script>
</body>
