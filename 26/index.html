<!DOCTYPE html>

<body>
  <script>

    let num = [1, 2, 3, 4];

    let doubleNum = [];

    function addOne() {
      for (let i = 0; i < num.length; i++) {
        let newNum = num[i] + 1;
        doubleNum.push(newNum);
      }

      return doubleNum;
    }

    console.log(addOne());



    
  </script>
</body>
</html>
