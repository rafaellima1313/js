<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>
    Rock Paper Scissors
  </h1>

  <div>
    <button onclick="playGame('Rock');" class="rock-btn">
      <img src="img/rock-emoji.png" alt="rock button">
    </button>
    <button onclick="playGame('Paper');" class="paper-btn">
      <img src="img/paper-emoji.png" alt="paper button">
    </button>
    <button onclick="playGame('Scissors');" class="scissors-btn">
      <img src="img/scissors-emoji.png" alt="scissors button">
    </button>
  </div>

  <div>
    <p class="js-result-output">
      <!--RESULT-->
    </p>

    <p class="js-move-output">
      <!--COMPUTER MOVE-->
    </p>

    <p class="js-score-output">
      <!--SCORE-->
    </p>
  </div>

  <button onclick="resetScore()">
    Reset Score
  </button>

  <script src="script.js"></script>
</body>
</html>
